# =========================================================
# nginx para la API detrás del proxy de Cloudflare (deploy DO futuro)
# =========================================================
# NOTA: en staging (VM Oracle) NO se usa nginx: hay un named tunnel de
# Cloudflare (servicio systemd `cloudflared`) que lleva
# api-staging.automarket-rd.com -> http://localhost:8081.
# Este conf es para el futuro droplet de DigitalOcean si se prefiere
# A record + Origin Cert en lugar de instalar cloudflared ahí.
#
# IMPORTANTE: usar subdominio de UN solo nivel (api-staging, no api.staging):
# el Universal SSL gratuito de Cloudflare no cubre segundos niveles.
#
# Instalación en el droplet (Ubuntu):
#   1. sudo apt install -y nginx
#   2. Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create Certificate
#      (hosts: api-staging.automarket-rd.com; 15 años)
#      cp cert.pem /etc/ssl/cloudflare/origin.pem
#      cp key.pem  /etc/ssl/cloudflare/origin.key
#   3. sudo cp ops/nginx-api-staging.conf /etc/nginx/sites-available/api-staging
#      sudo ln -s /etc/nginx/sites-available/api-staging /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. En Cloudflare: SSL/TLS -> Overview -> modo "Full (strict)"
#
# DNS (Cloudflare, Proxied):  A  api-staging  ->  IP_DEL_DROPLET

server {
    listen 443 ssl;
    http2 on;  # nginx < 1.25: usar "listen 443 ssl http2;" y borrar esta línea
    server_name api-staging.automarket-rd.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Default 1m rompe la subida de fotos por la API.
    client_max_body_size 25m;

    location / {
        # El compose de staging publica la API en 8081 del host.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La API confía en X-Forwarded-* (Program.cs): con esto detecta
        # HTTPS y emite la cookie JWT como SameSite=None+Secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

# HTTP -> HTTPS (Cloudflare igualmente siempre conecta por HTTPS al origen
# en modo Full strict, pero dejamos el redirect para accesos directos).
server {
    listen 80;
    server_name api-staging.automarket-rd.com;
    return 301 https://$host$request_uri;
}

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'

jobs:
  quality-gate:
    name: Quality gate (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test backend
        run: dotnet test Backend/AutoMarketRD.sln --configuration Release

  build-push:
    name: Build y publicar imágenes (GHCR)
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # GHCR exige nombres de imagen en minúsculas
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/AutoMarket.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/api:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Desplegar en servidor de producción
    needs: build-push
    # Se activa solo cuando el repositorio tenga la variable DEPLOY_ENABLED=true
    # (Settings → Secrets and variables → Actions → Variables) y los secrets
    # DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH configurados.
    # Ver docs/DEPLOY.md sección "CD por tags".
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --tags --force origin
            git checkout --force "${{ needs.build-push.outputs.version }}"
            # Si el release incluye migraciones nuevas, anteponer MIGRATE_ON_STARTUP=true:
            #   MIGRATE_ON_STARTUP=true docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f

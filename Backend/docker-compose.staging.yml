# docker-compose.staging.yml
# Uso (desde Backend/):
# docker compose -f docker-compose.staging.yml --env-file ../.env.staging up -d --build
# docker compose -f docker-compose.staging.yml --env-file ../.env.staging logs -f api
# docker compose -f docker-compose.staging.yml --env-file ../.env.staging down

name: automarket-staging

services:
  db:
    image: postgres:16
    container_name: automarket-db-staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    # Tuning dimensionado para el droplet objetivo de 2 GB (2 vCPU / 2 GB),
    # igual que docker-compose.prod.yml para que las pruebas de carga de
    # staging sean representativas. Sobrescribible desde .env.staging.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
    # Sin esto, queries en paralelo pueden fallar por el shm default de Docker (64 MB).
    shm_size: 256mb
    # Tiempo para un apagado limpio (checkpoint final) antes del SIGKILL.
    stop_grace_period: 30s
    # Techo de memoria por contenedor (dimensionado para el droplet de 2 GB).
    mem_limit: 768m
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: AutoMarket.API/Dockerfile
    container_name: automarket-api-staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?CONNECTION_STRING requerido}

      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET requerido}
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER requerido}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE requerido}

      SmtpSettings__Host: ${SMTP_HOST:?SMTP_HOST requerido}
      SmtpSettings__Port: ${SMTP_PORT:?SMTP_PORT requerido}
      SmtpSettings__User: ${SMTP_USER:?SMTP_USER requerido}
      SmtpSettings__Password: ${SMTP_PASSWORD:?SMTP_PASSWORD requerido}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME:?SMTP_SENDER_NAME requerido}
      SmtpSettings__SenderEmail: ${SMTP_SENDER_EMAIL:?SMTP_SENDER_EMAIL requerido}

      AWS__AccessKey: ${AWS_ACCESS_KEY:?AWS_ACCESS_KEY requerido}
      AWS__SecretKey: ${AWS_SECRET_KEY:?AWS_SECRET_KEY requerido}
      AWS__Region: ${AWS_REGION:?AWS_REGION requerido}
      AWS__BucketName: ${AWS_BUCKET_NAME:?AWS_BUCKET_NAME requerido}
      AWS__ServiceUrl: ${AWS_SERVICE_URL:?AWS_SERVICE_URL requerido}

      PayPal__Mode: ${PAYPAL_MODE:?PAYPAL_MODE requerido}
      PayPal__UrlBase: ${PAYPAL_URL_BASE:?PAYPAL_URL_BASE requerido}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:?PAYPAL_CLIENT_ID requerido}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET:?PAYPAL_CLIENT_SECRET requerido}
      PayPal__ReturnUrl: ${PAYPAL_RETURN_URL:?PAYPAL_RETURN_URL requerido}
      PayPal__CancelUrl: ${PAYPAL_CANCEL_URL:?PAYPAL_CANCEL_URL requerido}
      PayPal__WebhookId: ${PAYPAL_WEBHOOK_ID:-}

      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:?CORS_ALLOWED_ORIGIN_0 requerido}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-}
      Cors__AllowedOrigins__2: ${CORS_ALLOWED_ORIGIN_2:-}
      Cors__AllowedOrigins__3: ${CORS_ALLOWED_ORIGIN_3:-}

      MigrateOnStartup: ${MIGRATE_ON_STARTUP:?MIGRATE_ON_STARTUP requerido}
      Seeder__Enabled: ${SEEDER_ENABLED:?SEEDER_ENABLED requerido}

      Admin__Email: ${ADMIN_EMAIL:?ADMIN_EMAIL requerido}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requerido}
      Admin__RotatePassword: ${ADMIN_ROTATE_PASSWORD:?ADMIN_ROTATE_PASSWORD requerido}

      App__FrontendUrl: ${APP_FRONTEND_URL:?APP_FRONTEND_URL requerido}

      # Límite global por IP (default 300/min). Elevable temporalmente para
      # pruebas de carga vía RATE_LIMIT_GLOBAL en el entorno del comando.
      RateLimiting__GlobalPermitLimit: ${RATE_LIMIT_GLOBAL:-300}
    ports:
      - "8081:8080"
    volumes:
      # Persiste los file logs de Serilog entre redeploys (logs/api-*.log)
      - api_logs_staging:/app/logs
    # Techo de memoria (droplet 2 GB), igual que en prod.
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        # Anuncios permanentes en staging (no son secretos). Toggle a "false"
        # para apagarlos temporalmente (p. ej. durante pruebas de carga).
        VITE_ADSENSE_ENABLED: "true"
        VITE_ADSENSE_CLIENT: ca-pub-7789207730134520
    container_name: automarket-frontend-staging
    ports:
      - "5174:80"
    # nginx sirviendo estáticos: 128m sobra.
    mem_limit: 128m
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    container_name: automarket-db-backup-staging
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 14
      CRON_SCHEDULE: "0 3 * * *"
      BACKUP_S3_BUCKET: ${AWS_BUCKET_NAME:?AWS_BUCKET_NAME requerido}
      BACKUP_S3_PREFIX: db-backups/staging
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY:?AWS_ACCESS_KEY requerido}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_KEY:?AWS_SECRET_KEY requerido}
      AWS_S3_ENDPOINT: ${AWS_SERVICE_URL:?AWS_SERVICE_URL requerido}
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - db_backups_staging:/backups
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache --no-progress aws-cli >/dev/null
        echo "$${CRON_SCHEDULE} sh /backup-db.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        chmod 0600 /etc/crontabs/root
        crond -f -l 2
    depends_on:
      db:
        condition: service_healthy
    # pg_dump en streaming: 256m cubre bases de cientos de MB.
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata_staging:
  db_backups_staging:
  api_logs_staging:
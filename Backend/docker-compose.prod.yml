# docker-compose.prod.yml
services:
  db:
    image: postgres:16
    container_name: automarket-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD}  # ← Password diferente para prod
    # NO exponemos el puerto 5432 al exterior (más seguro)
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: .
      dockerfile: AutoMarket.API/Dockerfile
    container_name: automarket-api-prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING_PROD}
      Jwt__Secret: ${JWT_SECRET_PROD}  # ← Secret diferente para prod
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      SmtpSettings__Host: ${SMTP_HOST}
      SmtpSettings__Port: ${SMTP_PORT}
      SmtpSettings__User: ${SMTP_USER}
      SmtpSettings__Password: ${SMTP_PASSWORD}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME}
      AWS__AccessKey: ${AWS_ACCESS_KEY}
      AWS__SecretKey: ${AWS_SECRET_KEY}
      AWS__Region: ${AWS_REGION}
      AWS__BucketName: ${AWS_BUCKET_NAME}
      PayPal__UrlBase: ${PAYPAL_URL_BASE}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET}
      PayPal__ReturnUrl: ${PAYPAL_RETURN_URL}
      PayPal__CancelUrl: ${PAYPAL_CANCEL_URL}
      PayPal__WebhookId: ${PAYPAL_WEBHOOK_ID}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS_PROD}  # ← Solo tu dominio real
      Admin__Email: ${ADMIN_EMAIL_PROD}
      Admin__Password: ${ADMIN_PASSWORD_PROD}  # ← Contraseña de admin solo para prod
      Admin__RotatePassword: ${ADMIN_ROTATE_PASSWORD_PROD:-false}

    # En producción NO exponemos la API al exterior: solo nginx (frontend)
    # se publica en el puerto 80 y reenvía /api/* a este contenedor.
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: automarket-frontend-prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: always

  db-backup:
    image: postgres:16
    container_name: automarket-db-backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 14
      # Ejecutar a las 03:00 todos los días (formato cron)
      CRON_SCHEDULE: "0 3 * * *"
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - db_backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache dcron
        chmod +x /backup-db.sh
        chmod 0600 /etc/crontabs/root || true
        echo "$${CRON_SCHEDULE} /backup-db.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata_prod:
  db_backups:
# docker-compose.prod.yml
#
# Todas las variables criticas usan la sintaxis ${VAR:?mensaje}: si falta
# cualquiera en .env.prod, el compose ABORTA al levantar en lugar de arrancar
# con secretos vacios (mismo criterio fail-fast que docker-compose.staging.yml).

name: automarket-prod

services:
  db:
    image: postgres:16
    container_name: automarket-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:?POSTGRES_PASSWORD_PROD requerido}  # ← Password diferente para prod
    # NO exponemos el puerto 5432 al exterior (más seguro)
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: .
      dockerfile: AutoMarket.API/Dockerfile
    container_name: automarket-api-prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING_PROD:?CONNECTION_STRING_PROD requerido}
      Jwt__Secret: ${JWT_SECRET_PROD:?JWT_SECRET_PROD requerido}  # ← Secret diferente para prod
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER requerido}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE requerido}
      SmtpSettings__Host: ${SMTP_HOST:?SMTP_HOST requerido}
      SmtpSettings__Port: ${SMTP_PORT:?SMTP_PORT requerido}
      SmtpSettings__User: ${SMTP_USER:?SMTP_USER requerido}
      SmtpSettings__Password: ${SMTP_PASSWORD:?SMTP_PASSWORD requerido}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME:?SMTP_SENDER_NAME requerido}
      SmtpSettings__SenderEmail: ${SMTP_SENDER_EMAIL:?SMTP_SENDER_EMAIL requerido}
      # Almacenamiento de imágenes: soporta AWS S3 real y Cloudflare R2.
      # Con AWS__ServiceUrl vacío usa AWS real (RegionEndpoint); con el
      # endpoint de R2 (https://<ACCOUNT_ID>.r2.cloudflarestorage.com) usa R2.
      AWS__AccessKey: ${AWS_ACCESS_KEY:?AWS_ACCESS_KEY requerido}
      AWS__SecretKey: ${AWS_SECRET_KEY:?AWS_SECRET_KEY requerido}
      AWS__Region: ${AWS_REGION:?AWS_REGION requerido}
      AWS__BucketName: ${AWS_BUCKET_NAME:?AWS_BUCKET_NAME requerido}
      AWS__ServiceUrl: ${AWS_SERVICE_URL:-}
      AWS__ExpirationMinutes: ${AWS_EXPIRATION_MINUTES:-15}
      PayPal__Mode: ${PAYPAL_MODE:-Live}
      PayPal__UrlBase: ${PAYPAL_URL_BASE:?PAYPAL_URL_BASE requerido}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:?PAYPAL_CLIENT_ID requerido}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET:?PAYPAL_CLIENT_SECRET requerido}
      PayPal__ReturnUrl: ${PAYPAL_RETURN_URL:?PAYPAL_RETURN_URL requerido}
      PayPal__CancelUrl: ${PAYPAL_CANCEL_URL:?PAYPAL_CANCEL_URL requerido}
      PayPal__WebhookId: ${PAYPAL_WEBHOOK_ID:?PAYPAL_WEBHOOK_ID requerido}
      Pago__TasaCambioRD_USD: ${PAGO_TASA_CAMBIO_RD_USD:-0.017}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS_PROD:?CORS_ALLOWED_ORIGINS_PROD requerido}
      Admin__Email: ${ADMIN_EMAIL_PROD:?ADMIN_EMAIL_PROD requerido}
      Admin__Password: ${ADMIN_PASSWORD_PROD:?ADMIN_PASSWORD_PROD requerido}
      Admin__RotatePassword: ${ADMIN_ROTATE_PASSWORD_PROD:-false}
      # En prod las migraciones y el seeder NO corren automáticamente por defecto.
      # - MigrateOnStartup: actívalo (=true) solo si el deploy NO ejecuta
      #   `dotnet ef database update` como paso previo.
      # - Seeder__Enabled: actívalo UNA sola vez en el primer arranque para
      #   crear el admin inicial y los planes; luego vuelve a false.
      MigrateOnStartup: ${MIGRATE_ON_STARTUP:-false}
      Seeder__Enabled: ${SEEDER_ENABLED:-false}
      # URL pública del frontend (usada en enlaces de correo, ej: confirmar correo)
      App__FrontendUrl: ${APP_FRONTEND_URL:?APP_FRONTEND_URL requerido}

    # Persiste los file logs de Serilog entre redeploys (logs/api-*.log)
    volumes:
      - api_logs_prod:/app/logs

    # En producción NO exponemos la API al exterior: solo nginx (frontend)
    # se publica en el puerto 80 y reenvía /api/* a este contenedor.
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: automarket-frontend-prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: always

  db-backup:
    image: postgres:16-alpine
    container_name: automarket-db-backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:?POSTGRES_PASSWORD_PROD requerido}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 14
      # Ejecutar a las 03:00 todos los días (formato cron)
      CRON_SCHEDULE: "0 3 * * *"
      # Copia offsite a S3/R2 (usa las mismas credenciales que la API)
      BACKUP_S3_BUCKET: ${AWS_BUCKET_NAME:?AWS_BUCKET_NAME requerido}
      BACKUP_S3_PREFIX: db-backups/prod
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY:?AWS_ACCESS_KEY requerido}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_KEY:?AWS_SECRET_KEY requerido}
      AWS_S3_ENDPOINT: ${AWS_SERVICE_URL:-}
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - db_backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache --no-progress aws-cli >/dev/null
        echo "$${CRON_SCHEDULE} sh /backup-db.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        chmod 0600 /etc/crontabs/root
        crond -f -l 2
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata_prod:
  db_backups:
  api_logs_prod:
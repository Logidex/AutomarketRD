server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subida de imágenes de anuncios (Kestrel permite hasta 50 MB)
    client_max_body_size 50m;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Content-Security-Policy. Nginx NO hereda add_header en un location que
    # define el suyo propio, por eso se repite en /assets/ e /index.html.
    # - style-src unsafe-inline: React y SweetAlert2 inyectan estilos inline.
    # - img-src incluye R2/S3 firmados (las fotos llegan por redirect 302).
    # - Google AdSense: script-src/style-src/img-src/connect-src permiten el SDK
    #   (pagead2.googlesyndication.com) y frame-src las cajas del anuncio
    #   (googleads.g.doubleclick.net, *.googlesyndication.com).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.googleads.g.doubleclick.net https://*.googleadservices.com; style-src 'self' 'unsafe-inline' https://*.googlesyndication.com; img-src 'self' data: https://*.r2.cloudflarestorage.com https://*.amazonaws.com https://*.googlesyndication.com https://*.doubleclick.net https://googleads.g.doubleclick.net https://*.google.com; font-src 'self' data:; connect-src 'self' https://*.googlesyndication.com https://*.google.com https://*.adtrafficquality.google; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://googleads.g.doubleclick.net; frame-ancestors 'none'" always;

    # Archivos estáticos del build (Vite los hashea con contenido)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.googleads.g.doubleclick.net https://*.googleadservices.com; style-src 'self' 'unsafe-inline' https://*.googlesyndication.com; img-src 'self' data: https://*.r2.cloudflarestorage.com https://*.amazonaws.com https://*.googlesyndication.com https://*.doubleclick.net https://googleads.g.doubleclick.net https://*.google.com; font-src 'self' data:; connect-src 'self' https://*.googlesyndication.com https://*.google.com https://*.adtrafficquality.google; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://googleads.g.doubleclick.net; frame-ancestors 'none'" always;
    }

    # El index.html SIEMPRE debe revalidarse (nunca servir un bundle viejo).
    # Sin esto, el navegador lo cachea por heurística (Last-Modified) y se
    # queda con la app anterior aunque se haya desplegado una versión nueva.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.googleads.g.doubleclick.net https://*.googleadservices.com; style-src 'self' 'unsafe-inline' https://*.googlesyndication.com; img-src 'self' data: https://*.r2.cloudflarestorage.com https://*.amazonaws.com https://*.googlesyndication.com https://*.doubleclick.net https://googleads.g.doubleclick.net https://*.google.com; font-src 'self' data:; connect-src 'self' https://*.googlesyndication.com https://*.google.com https://*.adtrafficquality.google; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://googleads.g.doubleclick.net; frame-ancestors 'none'" always;
    }

    # Reverse proxy a la API (.NET corre en el contenedor "api", puerto 8080)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

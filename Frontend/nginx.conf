server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subida de imágenes de anuncios (Kestrel permite hasta 50 MB)
    client_max_body_size 50m;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Archivos estáticos del build (Vite los hashea con contenido)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy a la API (.NET corre en el contenedor "api", puerto 8080)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
